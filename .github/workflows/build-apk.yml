name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use fixed debug key (keeps Google sign-in working)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build --if-present

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/daily-life.apk"
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Daily Life Android app" --notes "Latest Android build of Daily Life. Download daily-life.apk and install it on your phone."
          gh release upload latest "$RUNNER_TEMP/daily-life.apk" --clobber
