
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Build web application
      - name: Build web app
        run: npm run build --if-present

      # 6. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 7. Fix generated Android configuration
      - name: Fix Cordova Android configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path(
              "android/capacitor-cordova-android-plugins/build.gradle"
          )

          manifest = Path(
              "android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml"
          )

          if not gradle.exists():
              raise SystemExit("ERROR: Cordova build.gradle not found")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          # Ensure Gradle namespace exists
          gradle_text = gradle.read_text(encoding="utf-8")

          android_match = re.search(r'\bandroid\s*\{', gradle_text)

          if not android_match:
              raise SystemExit("ERROR: Android block not found")

          if not re.search(r'^\s*namespace\s*=', gradle_text, re.M):
              position = android_match.end()
              gradle_text = (
                  gradle_text[:position]
                  + '\n    namespace = "capacitor.cordova.android.plugins"'
                  + gradle_text[position:]
              )
              gradle.write_text(gradle_text, encoding="utf-8")

          # Remove obsolete package attribute from manifest root
          manifest_text = manifest.read_text(encoding="utf-8")

          fixed_text, count = re.subn(
              r'(<manifest\b[^>]*?)\s+package\s*=\s*(["\'])[^"\']*\2',
              r'\1',
              manifest_text,
              count=1,
              flags=re.S
          )

          if count:
              manifest.write_text(fixed_text, encoding="utf-8")

          # Verify manifest no longer has package attribute
          final_text = manifest.read_text(encoding="utf-8")
          root = re.search(r'<manifest\b[^>]*>', final_text, re.S)

          if not root:
              raise SystemExit("ERROR: Invalid Android manifest")

          if re.search(r'\bpackage\s*=', root.group()):
              raise SystemExit("ERROR: Manifest package attribute remains")

          if not re.search(r'^\s*namespace\s*=', 
                           gradle.read_text(encoding="utf-8"), re.M):
              raise SystemExit("ERROR: Gradle namespace missing")

          print("SUCCESS: Gradle namespace verified")
          print("SUCCESS: Manifest package attribute removed")
          PY

      # 8. Verify Java and Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. Build APK
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Life-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
